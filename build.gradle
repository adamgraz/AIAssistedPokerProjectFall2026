plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.pokerproject.server.PokerServer'
}

group = 'com.pokerproject'
version = '1.0-SNAPSHOT'

// Pins the JDK version compilation targets regardless of which JDK Gradle itself happens to
// run on (IntelliJ's "Gradle JVM" setting) - without this, compileJava silently targets
// whatever JDK is running Gradle, which can drift from the JDK actually used to run the app.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin-bundle:7.2.3'
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}